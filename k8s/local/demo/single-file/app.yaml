apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp-pod
  template:
    metadata:
      labels:
        app: myapp-pod
    spec:
      containers:
        - name: myapp-con
          image: nginx
          # env:
          #   - name: LOG_LEVEL
          #     value: "Development"
          #   - name: APP_COLOR
          #     value: "green"
          env:
            - name: APP_COLOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_COLOR
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-serv
spec:
  selector:
    app: myapp-pod
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000