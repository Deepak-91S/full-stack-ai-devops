apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myservice-a
  template:
    metadata:
      labels:
        app: myservice-a 
    spec:
      containers:
        - name: myservice-a-con
          image: embarkx/tax-service-a
          # env:
          #   - name: LOG_LEVEL
          #     value: "Development"
          #   - name: APP_COLOR
          #     value: "green"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: service-a-config
                  key: PORT
            - name: TAX_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: service-a-config
                  key: TAX_SERVICE_URL
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: myservice-a-serv
spec:
  selector:
    app: myservice-a
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31000