apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myservice-b
  template:
    metadata:
      labels:
        app: myservice-b
    spec:
      containers:
        - name: myservice-b-con
          # change the image tag based on app
          image: deepak3006/tax-service-b:node-latest                       
          ports:
            - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: myservice-b-service
spec:
  selector:
    app: myservice-b
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      