apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myservice-a
  template:
    metadata:
      labels:
        app: myservice-a 
    spec:
      containers:
        - name: myservice-a-con
          image: embarkx/tax-service-a
          env:
            - name: TAX_SERVICE_URL
              value: "http://myservice-b-service:4000"          
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: myservice-a-serv
spec:
  selector:
    app: myservice-a
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
