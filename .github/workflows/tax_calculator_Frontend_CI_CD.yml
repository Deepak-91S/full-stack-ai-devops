name: Tax Calculator UI CI/CD to AWS EKS

on: 
    # push
    workflow_dispatch:

# Building and Testing, Docker build and Push, Deploy to EKS

jobs:
    build-test:
        runs-on: ubuntu-latest        

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
        
            - name: Create .env for Build
              working-directory: docker/app2-tax-calculator/tax-calculator-frontend
              run: echo "VITE_API_URL=/api" > .env                  

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '24'

            - name: Install Dependencies
              working-directory: docker/app2-tax-calculator/tax-calculator-frontend
              run: npm ci              

            - name: Run Tests
              working-directory: docker/app2-tax-calculator/tax-calculator-frontend
              run: npm test --if-present
          
            - name: Build the Frontend
              working-directory: docker/app2-tax-calculator/tax-calculator-frontend
              run: npm run build

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test
        
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4    

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Create .env for Build
              working-directory: docker/app2-tax-calculator/tax-calculator-frontend
              run: echo "VITE_API_URL=/api" > .env

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v7
              with:
                context: docker/app2-tax-calculator/tax-calculator-frontend
                push: true
                tags: |
                    ${{secrets.DOCKERHUB_USERNAME}}/tax-calculator-frontend:latest
                    ${{secrets.DOCKERHUB_USERNAME}}/tax-calculator-frontend:${{github.sha}}

    deploy-aws-eks :
      runs-on: ubuntu-latest
      needs: docker-build-push

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-2

        - name: Setup kubectl
          uses: azure/setup-kubectl@v4

        - name: Update kubeconfig for EKS
          run: |
            aws eks update-kubeconfig --name hello-cluster-99 --region us-east-2 

        - name: Verify connection
          run: kubectl get nodes

        - name: Deploy to AWS(Kubernetes)
          run: |
            kubectl apply -f k8s/aws/deploy2/frontend/app.yaml
            kubectl apply -f k8s/aws/deploy2/ingress.yaml

