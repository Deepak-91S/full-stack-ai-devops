name: Tax Calculator Node CI/CD to AWS EKS

on:
    push:
        paths:
            - "docker/app1-hello/node/**"
    workflow_dispatch:

jobs:
    Build-and-Test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            service: [service-a, service-b]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: SetUp Node
              uses: actions/setup-node@v6
              with:
                node-version: 21

            - name: Install Dependencies
              working-directory: docker/app2-tax-calculator/node/${{matrix.service}}
              run: npm ci

            - name: Build and Test
              working-directory: docker/app2-tax-calculator/node/${{matrix.service}}
              run: npm test --if-present           


    Docker-build-push:
        runs-on: ubuntu-latest
        needs: Build-and-Test
        strategy:
          matrix:
            service: 
              - {name: "service-a", docker_name: "tax-service-a", path: "docker/app2-tax-calculator/node/service-a"}
              - {name: "service-b", docker_name: "tax-service-b", path: "docker/app2-tax-calculator/node/service-b"}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4 

            - name: Logging to DockerHub
              uses: docker/login-action@v4
              with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_PASSWORD }} 

            - name: Build and Push the Image
              uses: docker/build-push-action@v7
              with:
                context: ${{matrix.service.path}}
                push: true
                tags: |
                    ${{secrets.DOCKERHUB_USERNAME}}/${{matrix.service.docker_name}}:node-latest
                    ${{secrets.DOCKERHUB_USERNAME}}/${{matrix.service.docker_name}}:${{github.sha}}

    Deploy-aws-eks:
        runs-on: ubuntu-latest
        needs: Docker-build-push

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@v6
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: us-east-2

          - name: Setup Kubectl
            uses: azure/setup-kubectl@v4

          - name: Update kubeconfig for EKS
            run: |
              aws eks update-kubeconfig --name hello-cluster-99 --region us-east-2

          - name: Verify connection
            run: kubectl get nodes

          - name: Deploy to AWS(kubernetes)
            run: |
              kubectl apply -f k8s/aws/deploy2/service-a/app.yaml
              kubectl apply -f k8s/aws/deploy2/service-b/app.yaml
