name: Demo CI Env Secrets

on: 
    push
    # workflow_dispatch:
env:
    GLOBAL_ENV: global_env

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            JOB_LEVEL_ENV: job-level-env

        steps:
            - name: Say Hello
              run: echo "Hello from the second workflow! $GLOBAL_ENV and $JOB_LEVEL_ENV"

            - name: Testing Env values
              env:
                APP_ENV: demo_env
                DB_PASSWORD: ${{secrets.DB_PASSWORD}}
              run: echo "Hi How is your project $APP_ENV using $DB_PASSWORD"
        