name: Demo CI Env Secrets

on: 
    # push
    workflow_dispatch:
env:
    GLOBAL_ENV: global_env

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            JOB_LEVEL_ENV: job-level-env

        steps:
            - name: Say Hello
              run: echo "Hello from the second workflow! $GLOBAL_ENV and $JOB_LEVEL_ENV"

            - name: Create File
              run: |
                echo "Hello World!, We are in AI world!!!" > Hello.txt
                echo "File Creation Successfull!!!"

            - name: Upload Demo Doc
              uses: actions/upload-artifact@v7
              with:
                name: my-demo-artifact
                path: .

            - name: Testing Env values
              env:
                APP_ENV: demo_env
                DB_PASSWORD: ${{secrets.DB_PASSWORD}}
              run: echo "Hi How is your project $APP_ENV using $DB_PASSWORD"

    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Test Job Step              
              run: echo "Test job run happened!!"
        